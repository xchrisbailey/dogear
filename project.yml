name: Dogear
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
options:
  bundleIdPrefix: computer.srcery
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # The Keychain refuses apps signed without entitlements, so simulator builds are signed
    # ad hoc (per target below, where XcodeGen's preset would override it) and need no team.
    # Device and archive builds sign automatically with this team.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5U2B7W5F39
    # MARKETING_VERSION lives in Config/Version.xcconfig: bumping it starts a TestFlight build.
    # Xcode Cloud and scripts/testflight.sh override this per upload; TestFlight needs it to increase.
    CURRENT_PROJECT_VERSION: "1"
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit
    exactVersion: 3.11.1
  DogearCore:
    path: Core
targets:
  Dogear:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Reader/Resources/**"]
      # The CFI bridge's scripts, loaded from the app bundle as WKUserScripts, and the
      # MOBI, AZW3 and FB2 converter's modules (foliate-js).
      - path: App/Reader/Resources
        buildPhase: resources
    dependencies:
      - package: DogearCore
      - {package: Readium, product: ReadiumShared}
      - {package: Readium, product: ReadiumStreamer}
      - {package: Readium, product: ReadiumNavigator}
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.dogear
        INFOPLIST_KEY_CFBundleDisplayName: Dogear
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Merged with the generated keys; holds what has no INFOPLIST_KEY_ setting, like the
        # audio background mode that keeps audiobooks playing on the lock screen.
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Dogear.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        # HTTPS only, except plain HTTP to a Tailscale Server (ATS keys in App/Info.plist, ADR 0006).
  DogearTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
        excludes: ["Fixtures/**"]
      - path: AppTests/Fixtures/LighthouseLedger
        type: folder
        buildPhase: resources
      - path: AppTests/Fixtures/Converted
        type: folder
        buildPhase: resources
    dependencies:
      - target: Dogear
      - {package: Readium, product: ReadiumShared}
      - {package: Readium, product: ReadiumStreamer}
      - {package: Readium, product: ReadiumNavigator}
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
schemes:
  Dogear:
    build:
      targets: {Dogear: all, DogearTests: [test]}
    test:
      targets: [DogearTests]
