name: Dogear
options:
  bundleIdPrefix: com.xchrisbailey
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # Simulator-only builds; drop for device builds.
    CODE_SIGNING_ALLOWED: NO
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit
    exactVersion: 3.11.1
  DogearCore:
    path: Core
targets:
  Dogear:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Reader/Resources/**"]
      # The CFI bridge's scripts, loaded from the app bundle as WKUserScripts.
      - path: App/Reader/Resources
        buildPhase: resources
    dependencies:
      - package: DogearCore
      - {package: Readium, product: ReadiumShared}
      - {package: Readium, product: ReadiumStreamer}
      - {package: Readium, product: ReadiumNavigator}
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dogear
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Merged with the generated keys; holds what has no INFOPLIST_KEY_ setting, like the
        # audio background mode that keeps audiobooks playing on the lock screen.
        INFOPLIST_FILE: App/Info.plist
        # No NSAppTransportSecurity exceptions: HTTPS only (spec #1).
  DogearTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
        excludes: ["Fixtures/**"]
      - path: AppTests/Fixtures/LighthouseLedger
        type: folder
        buildPhase: resources
    dependencies:
      - target: Dogear
      - {package: Readium, product: ReadiumShared}
      - {package: Readium, product: ReadiumStreamer}
      - {package: Readium, product: ReadiumNavigator}
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dogear:
    build:
      targets: {Dogear: all, DogearTests: [test]}
    test:
      targets: [DogearTests]
